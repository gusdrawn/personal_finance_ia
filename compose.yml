services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      TRADING_DATA_MODE: "DEMO"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BANK_SYNC_SESSION_DIR: /app/tmp/bank_sync_session
    depends_on:
      redis:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: .
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      TRADING_DATA_MODE: "DEMO"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BANK_SYNC_SESSION_DIR: /app/tmp/bank_sync_session
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A finanzas_project worker --pool=solo --loglevel=info
